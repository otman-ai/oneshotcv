[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneshotcv"
version = "0.2.0"
description = "OneShotCV simplifies the visual design and rendering of computer vision tasks such as drawing bounding boxes, masks, labels, keypoints and text."
authors = [
    {name = "Otman", email = "otmanheddouchai@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["computer-vision", "opencv", "pillow", "visualization", "bounding-box", "segmentation"]
dependencies = [
    "pillow>=9.2.0",
    "opencv-python>=4.5",
    "numpy>=1.21",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
"Homepage" = "https://github.com/otman-ai/oneshotcv"
"Source" = "https://github.com/otman-ai/oneshotcv"
"Issues" = "https://github.com/otman-ai/oneshotcv/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["oneshotcv*"]
namespaces = false

[tool.setuptools.package-data]
oneshotcv = ["fonts/*.ttf", "fonts/*.otf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
